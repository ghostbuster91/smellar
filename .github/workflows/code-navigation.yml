name: Code navigation

# Indexes this repository into a SCIP index and uploads it to Sourcegraph, which
# is what gives sourcegraph.com precise "go to definition" and "find references"
# here instead of the search-based fallback.
#
# scip-java's Scala support is not released yet, so the indexer is built from
# source at the revision pinned below rather than installed from Maven Central.
# Once a release carries it, the two checkout/build steps collapse into
# installing the published CLI.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The scip-java build that understands sbt 2 and Scala. Prefer a commit SHA
  # over a branch name, so that re-running indexes with the same indexer.
  SCIP_JAVA_REPOSITORY: ghostbuster91/scip-java
  SCIP_JAVA_REF: 65134eada271d969a245e4cd5c09c0c723d24422
  # scip-java has no Gradle wrapper, so its build needs a Gradle on PATH.
  GRADLE_VERSION: 9.9.2
  # Serves both the indexer's own build (needs 17+) and this project, which
  # targets 21.
  JAVA_VERSION: "21"

jobs:
  index:
    name: Index and upload SCIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Check out scip-java
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SCIP_JAVA_REPOSITORY }}
          ref: ${{ env.SCIP_JAVA_REF }}
          path: .scip-java-src

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build the scip-java CLI
        working-directory: .scip-java-src
        run: gradle :scip-java:installDist --no-daemon

      - name: Index this repository
        # The indexer drives sbt itself: it injects a plugin that turns on
        # SemanticDB, compiles every project, and converts the output to SCIP.
        # It fails on an empty index, so reaching the upload means there is
        # something in it.
        run: |
          "$GITHUB_WORKSPACE/.scip-java-src/scip-java/build/install/scip-java/bin/scip-java" \
            index --build-tool=sbt
          ls -l index.scip

      - name: Keep the index as a build artifact
        # Worth having when an upload is rejected: the index can be inspected
        # with `scip print` / `scip stats` without re-running the build.
        uses: actions/upload-artifact@v7
        with:
          name: index.scip
          path: index.scip
          retention-days: 7

      - name: Install the Sourcegraph CLI
        run: |
          curl -fsSL https://sourcegraph.com/.api/src-cli/src_linux_amd64 -o "$RUNNER_TEMP/src"
          chmod +x "$RUNNER_TEMP/src"

      - name: Upload the index to Sourcegraph
        # `GITHUB_TOKEN` is how sourcegraph.com verifies that this workflow is
        # allowed to write to this public repository, so there is no secret to
        # configure. For a private instance, drop the flag and set SRC_ENDPOINT
        # plus an SRC_ACCESS_TOKEN secret instead.
        run: |
          "$RUNNER_TEMP/src" code-intel upload \
            -github-token='${{ secrets.GITHUB_TOKEN }}' \
            -repo="$GITHUB_REPOSITORY" \
            -commit="$GITHUB_SHA"
